<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share It Forward — Coca-Cola Growth Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #E30613;
    --red-deep: #B10510;
    --cream: #FFF8F0;
    --ink: #2A1210;
    --ink-soft: #6B4A46;
    --line: rgba(42,18,16,0.14);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter', sans-serif; color: var(--ink);
    background: var(--red);
    padding: 32px 16px;
  }
  .stage{ width:100%; max-width: 440px; }
  .brand{ text-align:center; margin-bottom: 20px; }
  .brand .mark{
    font-family:'Poppins', sans-serif; font-weight: 800; font-size: 20px; color: #fff;
  }
  .brand .tag{
    font-size: 11px; color: #FFD9D9; margin-top: 6px;
    letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;
  }
  .card{
    background: var(--cream); border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.5);
  }
  .bottle{
    margin: 0 auto 18px; width: 92px; height: 180px; position:relative;
    background: linear-gradient(180deg, #3A1010, #170505);
    border-radius: 14px 14px 28px 28px;
  }
  .bottle::before{
    content:''; position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    width: 26px; height: 26px; background: #170505; border-radius: 4px 4px 0 0;
  }
  .bottle .label{
    position:absolute; top: 56px; left: 6px; right: 6px;
    background: #fff; border-radius: 4px; padding: 10px 6px;
    text-align:center;
  }
  .bottle .label .pre{ font-size: 8px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform:uppercase; }
  .bottle .label .name{ font-family:'Poppins', sans-serif; font-weight: 800; font-size: 15px; color: var(--red); word-break: break-word; }

  .field{ margin-bottom: 12px; }
  .field label{
    display:block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .field input{
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    font-family:'Inter', sans-serif; font-size: 14.5px; color: var(--ink); background: #fff;
  }
  .field input:focus{ outline:none; border-color: var(--red); }

  .generate-btn{
    display:block; width: 100%; padding: 14px 18px; border-radius: 999px; border: none;
    background: var(--red); color: #fff; font-family:'Poppins', sans-serif; font-weight: 700;
    font-size: 14px; cursor: pointer; margin-top: 6px; transition: background 160ms ease, transform 160ms ease;
  }
  .generate-btn:hover{ background: var(--red-deep); transform: translateY(-1px); }

  .result{ display:none; margin-top: 22px; animation: rise 450ms ease; }
  .result.show{ display:block; }
  @keyframes rise{ from{ opacity:0; transform: translateY(12px); } to{ opacity:1; transform: translateY(0); } }

  .loop-box{
    border: 1.5px solid var(--line); border-radius: 14px; padding: 16px;
    background: #fff; margin-bottom: 14px;
  }
  .loop-head{
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;
    color: var(--red); margin-bottom: 10px;
  }
  .loop-chain{ display:flex; align-items:center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .loop-node{
    display:flex; align-items:center; gap: 6px;
    background: var(--cream); border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 700;
  }
  .loop-arrow{ color: var(--ink-soft); font-size: 13px; }
  .loop-stats{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .loop-stat{ text-align:center; }
  .loop-stat .n{ font-family:'Poppins', sans-serif; font-weight: 800; font-size: 20px; color: var(--red); }
  .loop-stat .l{ font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }

  .cta{
    display:block; width: 100%; padding: 13px 18px; border-radius: 999px; border: 1.5px solid var(--ink);
    background: #fff; color: var(--ink); font-family:'Poppins', sans-serif; font-weight: 700;
    font-size: 13px; cursor: pointer; transition: all 160ms ease;
  }
  .cta:hover{ background: var(--ink); color: #fff; }
  .share-hint{ margin-top: 12px; font-size: 11px; color: var(--ink-soft); text-align:center; }
  .share-hint b{ color: var(--red); }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <div class="mark">Coca-Cola</div>
    <div class="tag">Share It Forward · Growth Loop Prototype</div>
  </div>

  <div class="card">
    <div class="bottle">
      <div class="label">
        <div class="pre">Share a Coke with</div>
        <div class="name" id="bottleName">You</div>
      </div>
    </div>

    <div class="field">
      <label for="yourName">Your name</label>
      <input type="text" id="yourName" placeholder="e.g. Maya" maxlength="18">
    </div>
    <div class="field">
      <label for="friendName">A friend's name</label>
      <input type="text" id="friendName" placeholder="e.g. Josh" maxlength="18">
    </div>

    <button class="generate-btn" id="generateBtn">Send them a bottle</button>

    <div class="result" id="result">
      <div class="loop-box">
        <p class="loop-head">Your growth loop, simulated</p>
        <div class="loop-chain" id="loopChain"></div>
        <div class="loop-stats">
          <div class="loop-stat"><div class="n" id="kFactor">—</div><div class="l">Est. referrals / sender</div></div>
          <div class="loop-stat"><div class="n" id="rewardCode">—</div><div class="l">Both unlock a reward code</div></div>
        </div>
      </div>
      <button class="cta" id="regenBtn">Simulate another send</button>
      <p class="share-hint">Real version: scan the cap's QR on-pack to start your own loop with <b>#ShareItForward</b></p>
    </div>
  </div>
</div>

<script>
  const yourName = document.getElementById('yourName');
  const friendName = document.getElementById('friendName');
  const bottleName = document.getElementById('bottleName');
  const result = document.getElementById('result');
  const loopChain = document.getElementById('loopChain');
  const kFactor = document.getElementById('kFactor');
  const rewardCode = document.getElementById('rewardCode');

  friendName.addEventListener('input', () => {
    bottleName.textContent = friendName.value.trim() || 'You';
  });

  function hashCode(str){
    let hash = 0;
    for(let i=0; i<str.length; i++){
      hash = (hash << 5) - hash + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  function initials(name){
    return name.trim().slice(0,1).toUpperCase() || '?';
  }

  document.getElementById('generateBtn').addEventListener('click', build);
  document.getElementById('regenBtn').addEventListener('click', build);

  function build(){
    const you = yourName.value.trim() || 'You';
    const friend = friendName.value.trim() || 'A friend';
    bottleName.textContent = friend;

    loopChain.innerHTML = '';
    const names = [you, friend, 'their +1'];
    names.forEach((n, i) => {
      if(i > 0){
        const arrow = document.createElement('span');
        arrow.className = 'loop-arrow';
        arrow.textContent = '→';
        loopChain.appendChild(arrow);
      }
      const node = document.createElement('span');
      node.className = 'loop-node';
      node.textContent = (i < 2 ? initials(n) + ' ' + n : n);
      loopChain.appendChild(node);
    });

    const h = hashCode(you + friend);
    const k = (0.3 + (h % 40) / 100).toFixed(2);
    kFactor.textContent = k;
    rewardCode.textContent = 'GIVE1GET1';
    result.classList.add('show');
  }
</script>

</body>
</html>
