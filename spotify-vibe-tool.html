<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Say The Vibe — Prompted Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #121212;
    --card: #181818;
    --card-hover: #212121;
    --green: #1ED760;
    --green-deep: #17B355;
    --white: #FFFFFF;
    --gray: #B3B3B3;
    --line: rgba(255,255,255,0.1);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter', sans-serif; color: var(--white);
    background: var(--black);
    padding: 32px 16px;
  }
  .stage{ width:100%; max-width: 460px; }
  .brand{ text-align:center; margin-bottom: 26px; }
  .brand .mark{
    font-family:'Poppins', sans-serif; font-weight: 800; font-size: 20px; color: var(--white);
  }
  .brand .tag{
    font-size: 11.5px; color: var(--green); margin-top: 4px;
    letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;
  }
  .card{
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 30px 26px;
    box-shadow: 0 24px 60px -30px rgba(0,0,0,0.6);
  }
  .prompt-label{
    font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gray); font-weight: 700; margin: 0 0 10px;
  }
  .prompt-input{
    width: 100%; background: #0F0F0F; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 16px 16px; color: var(--white); font-family:'Inter', sans-serif; font-size: 15px;
    resize: none; margin-bottom: 14px; min-height: 78px;
  }
  .prompt-input:focus{ outline:none; border-color: var(--green); }
  .prompt-input::placeholder{ color: #6B6B6B; }

  .chips{ display:flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip{
    font-size: 12px; font-weight: 600; color: var(--gray);
    background: #0F0F0F; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; cursor:pointer; transition: all 160ms ease;
  }
  .chip:hover{ border-color: var(--green); color: var(--white); }

  .generate-btn{
    display:block; width: 100%; padding: 14px 18px; border-radius: 999px; border: none;
    background: var(--green); color: #0A0A0A; font-family:'Inter', sans-serif; font-weight: 700;
    font-size: 14.5px; cursor: pointer; transition: background 160ms ease, transform 160ms ease;
  }
  .generate-btn:hover{ background: var(--green-deep); transform: translateY(-1px); }

  .result{ display:none; margin-top: 22px; text-align:center; animation: rise 500ms ease; }
  .result.show{ display:block; }
  @keyframes rise{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform: translateY(0); } }

  .cover{
    width: 100%; aspect-ratio: 1/1; border-radius: 14px; margin-bottom: 16px;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .cover .emoji{ font-size: 54px; }
  .cover .glow{
    position:absolute; inset:0; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25), transparent 60%);
  }

  .playlist-title{
    font-family:'Poppins', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3;
    margin: 0 0 6px; text-align:left;
  }
  .playlist-meta{
    font-size: 12.5px; color: var(--gray); text-align:left; margin-bottom: 18px;
  }
  .cta{
    display:block; width: 100%; padding: 13px 18px; border-radius: 999px; border: none;
    background: var(--white); color: #0A0A0A; font-family:'Inter', sans-serif; font-weight: 700;
    font-size: 14px; cursor: pointer; transition: transform 160ms ease;
  }
  .cta:hover{ transform: translateY(-1px); }
  .share-hint{ margin-top: 16px; font-size: 12px; color: var(--gray); }
  .share-hint b{ color: var(--green); }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <div class="mark">Spotify</div>
    <div class="tag">Say The Vibe · Prompted Playlist</div>
  </div>

  <div class="card">
    <p class="prompt-label">Describe today's vibe</p>
    <textarea class="prompt-input" id="promptInput" placeholder="e.g. songs that sound like a Sunday I'm avoiding"></textarea>

    <div class="chips">
      <span class="chip" data-p="main character energy before 9am">main character energy before 9am</span>
      <span class="chip" data-p="walking home in the rain but it's kind of nice">walking home in the rain, kind of nice</span>
      <span class="chip" data-p="pretending I have my life together">pretending I have my life together</span>
    </div>

    <button class="generate-btn" id="generateBtn">Generate my playlist</button>

    <div class="result" id="result">
      <div class="cover" id="cover"><div class="glow"></div><span class="emoji" id="coverEmoji">🎧</span></div>
      <p class="playlist-title" id="playlistTitle">"your vibe here"</p>
      <p class="playlist-meta" id="playlistMeta">24 songs · 58 min · Made from your words</p>
      <button class="cta" id="regenBtn">▶ Play preview</button>
      <p class="share-hint">Share your prompt with <b>#SayTheVibe</b></p>
    </div>
  </div>
</div>

<script>
  const palettes = [
    { grad: ['#1ED760', '#0A5C28'], emoji: '🌤️' },
    { grad: ['#5C4CFF', '#1A1240'], emoji: '🌧️' },
    { grad: ['#FF4C77', '#3A0A1A'], emoji: '🔥' },
    { grad: ['#FFB84C', '#4A2E00'], emoji: '☀️' },
    { grad: ['#4CD3FF', '#0A2A40'], emoji: '🌊' },
    { grad: ['#B34CFF', '#2A0A40'], emoji: '✨' },
  ];

  function hashCode(str){
    let hash = 0;
    for(let i=0; i<str.length; i++){
      hash = (hash << 5) - hash + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  const input = document.getElementById('promptInput');
  const result = document.getElementById('result');
  const cover = document.getElementById('cover');
  const coverEmoji = document.getElementById('coverEmoji');
  const playlistTitle = document.getElementById('playlistTitle');
  const playlistMeta = document.getElementById('playlistMeta');

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => { input.value = chip.dataset.p; });
  });

  function generate(){
    const text = input.value.trim();
    if(!text) return;
    const h = hashCode(text.toLowerCase());
    const p = palettes[h % palettes.length];
    cover.style.background = `linear-gradient(160deg, ${p.grad[0]}, ${p.grad[1]})`;
    coverEmoji.textContent = p.emoji;
    playlistTitle.textContent = `"${text}"`;
    const songCount = 12 + (h % 20);
    const minutes = 30 + (h % 45);
    playlistMeta.textContent = `${songCount} songs · ${minutes} min · Made from your words`;
    result.classList.add('show');
  }

  document.getElementById('generateBtn').addEventListener('click', generate);
  document.getElementById('regenBtn').addEventListener('click', generate);
</script>

</body>
</html>
